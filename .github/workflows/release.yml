name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Nix
        uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Check and build plugin
        run: nix develop --command bun run check

      - name: Bump tag version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: ""

      - name: Stage release assets
        if: steps.tag.outputs.new_tag != 'undefined'
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.new_version }}
        run: |
          mkdir release
          cp main.js styles.css release/
          jq --arg version "$RELEASE_VERSION" '.version = $version' manifest.json > release/manifest.json

      - name: Create GitHub release
        if: steps.tag.outputs.new_tag != 'undefined'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          fail_on_unmatched_files: true
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
